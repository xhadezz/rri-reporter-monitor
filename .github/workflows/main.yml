name: Scan RRI setiap 1 jam

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: rri-reporter-monitor-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Jalankan scanner
        run: python scan.py

      - name: Tampilkan hasil scanner
        run: |
          python - <<'PY'
          import json
          with open('data.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps(data.get('meta', {}), ensure_ascii=False, indent=2))
          PY

      - name: Simpan hasil scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada data.json."
          else
            git commit -m "Update hasil scan RRI"
            git push
          fi
