name: Diagnose RRI Article with curl_cffi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install curl_cffi
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Probe RRI article and listing (read-only)
        run: python diagnose_curl_cffi_article.py
