name: Scan RRI every 6 hours
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Scan RRI
        run: python scan.py
      - name: Commit data
        run: |
          git config user.name 'RRI Reporter Monitor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m "Update RRI monitor data"
          git push
